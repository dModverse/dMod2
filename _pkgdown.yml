url: https://dmodverse.github.io/dMod2/

redirects:
- ["articles/distributedComputing.html", "articles/guide-remote-computing.html"]
- ["articles/guide-fit.html", "articles/guide-optimization.html"]
- ["articles/guide-prediction.html", "articles/guide-prediction-uncertainty.html"]
- ["articles/guide-mixed-effects.html", "articles/guide-nlme.html"]
- ["articles/guide-groupings.html", "articles/guide-group-effects.html"]

template:
  bootstrap: 5
  math-rendering: mathjax

navbar:
  structure:
    left: [guide, articles, reference, news]
    right: [search, github]
  components:
    guide:
      text: Guide
      menu:
      - text: "1. Setting up models"
        href: articles/guide-model.html
      - text: "2. Symmetries"
        href: articles/guide-symmetries.html
      - text: "3. Sensitivities"
        href: articles/guide-sensitivities.html
      - text: "4. Optimization"
        href: articles/guide-optimization.html
      - text: "5. Profile likelihood"
        href: articles/guide-profiles.html
      - text: "6. Prediction uncertainty"
        href: articles/guide-prediction-uncertainty.html
      - text: "7. Nonlinear mixed-effects models"
        href: articles/guide-nlme.html
      - text: "8. Group-specific effects"
        href: articles/guide-group-effects.html
      - text: "9. Alignment of relative data measurements"
        href: articles/guide-alignment.html
      - text: "10. PEtab import and export"
        href: articles/guide-petab.html
      - text: "11. Remote computing"
        href: articles/guide-remote-computing.html
    github:
      icon: fa-github
      href: https://github.com/dModverse/dMod2
      aria-label: GitHub

articles:
- title: Guide
  navbar: ~
  desc: The NFκB project of Oppelt et al. (2018), chapter by chapter; theophylline for mixed effects, simulated blots for the alignment.
  contents:
