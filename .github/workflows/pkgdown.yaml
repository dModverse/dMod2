# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-${{ github.ref }}
    env:
      # as in R-CMD-check.yaml: the PAT resolves the cppDE Remote
      GITHUB_PAT: ${{ secrets.DMODVERSE_PAT || secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # the examples reach SymPy for code generation, libsbml for PEtab and symident for
      # the symmetries, as in R-CMD-check.yaml
      - name: Install the Python packages and point reticulate at them
        shell: bash
        run: |
          python -m pip install --upgrade pip sympy numpy scipy python-libsbml
          python -m pip install symident
          echo "RETICULATE_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      # the reference runs the examples and the guide chapters run their code; the articles of
      # the example projects show their rendered pages and run nothing
      - name: Build the site
        shell: Rscript {0}
        run: |
          pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: true
          branch: gh-pages
          folder: docs
